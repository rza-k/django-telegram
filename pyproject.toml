[project]
name = "django-telegram-bot-api"
version = "0.1.2"
description = "A typed Telegram Bot API client for Django"
readme = "README.md"
authors = [
    { name = "reza", email = "rza.karampour@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "pydantic",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "django_telegram"